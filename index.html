<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9dfcc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110e" media="(prefers-color-scheme: dark)">
<title>Pythras · outils de musique</title>
<style>
:root{
  --bg:#e9dfcc; --paper:#f7f0e3; --ink:#231c17; --ink2:#5b4b3e; --ink3:#8d7c6b;
  --line:#d3c3aa; --accent:#9c4a26;
  --glow1:rgba(255,250,240,.75); --glow2:rgba(185,134,47,.10);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15110e; --paper:#211a15; --ink:#efe5d4; --ink2:#c9bba7; --ink3:#978774;
    --line:#4a3e33; --accent:#e0855a;
    --glow1:rgba(255,215,170,.05); --glow2:rgba(224,133,90,.08);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink); font-family:var(--serif);
  background:
    radial-gradient(120% 70% at 50% -10%, var(--glow1), transparent 60%),
    radial-gradient(90% 60% at 100% 110%, var(--glow2), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
main{max-width:560px; margin:0 auto; padding:72px 22px 48px}
header{text-align:center; margin-bottom:44px}
h1{font-weight:600; font-size:26px; letter-spacing:.32em; margin:0 0 0 .32em; text-transform:uppercase}
.sub{margin:10px 0 0; font-style:italic; font-size:15px; color:var(--ink3)}
.rule{width:42px; height:1px; background:var(--accent); margin:22px auto 0; opacity:.7}

ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
a.tool{
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:14px;
  padding:18px 20px; border:1px solid var(--line); border-radius:14px;
  background:var(--paper); color:inherit; text-decoration:none;
  transition:border-color .15s, transform .15s;
}
a.tool:hover, a.tool:focus-visible{border-color:var(--accent); transform:translateY(-1px); outline:none}
a.tool:active{transform:none}
.name{display:block; font-weight:600; font-size:17px; letter-spacing:.16em; text-transform:uppercase}
.desc{display:block; margin-top:5px; font-size:15px; line-height:1.4; color:var(--ink2)}
.arrow{font-size:20px; color:var(--accent)}

footer{margin-top:48px; text-align:center; font-size:13px; font-style:italic; color:var(--ink3)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Pythras</h1>
    <p class="sub">outils de musique</p>
    <div class="rule"></div>
  </header>

  <ul>
    <!-- Pour ajouter une appli : copie un bloc <li>…</li> et change
         l'adresse (href), le nom et la description. -->
    <li>
      <a class="tool" href="ecarts/">
        <span>
          <span class="name">Écarts</span>
          <span class="desc">Les intervalles : les reconnaître sur la portée, par cœur et à l’oreille.</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a class="tool" href="plan-cla/">
        <span>
          <span class="name">Plan harmonique</span>
          <span class="desc">Un pad d’accords pour jouer le plan harmonique classique, degré par degré.</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>

  <footer>Fonctionne sur téléphone et ordinateur, sans installation.</footer>
</main>
</body>
</html>
